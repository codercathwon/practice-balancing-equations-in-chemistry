<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Balancing Equations Practice</title>
    <meta
      name="description"
      content="Practice balancing chemical equations with endless randomly generated problems, hints and a live atom tally."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="class-label">11 - FIBONACCI</p>
      <h1>Practice Balancing Equations</h1>
      <p class="subtitle">Type the coefficients so every atom appears the same number of times on both sides.</p>
    </header>

    <main>
      <div class="toolbar">
        <div class="levels" role="group" aria-label="Difficulty">
          <button type="button" data-level="easy">Easy</button>
          <button type="button" data-level="medium">Medium</button>
          <button type="button" data-level="hard">Hard</button>
          <button type="button" data-level="mixed">Mixed</button>
        </div>
        <p class="stats">
          Solved <b id="stat-solved">0</b>
          <span aria-hidden="true">·</span> Streak <b id="stat-streak">0</b>
          <span aria-hidden="true">·</span> Best <b id="stat-best">0</b>
        </p>
      </div>

      <section class="card problem" aria-label="Equation">
        <div class="card-top">
          <span class="badge" id="type"></span>
        </div>
        <div class="equation" id="equation"></div>
        <div class="tally" id="tally" role="group" aria-label="Atoms on each side: reactants, element, products"></div>
        <p class="note">Empty boxes count as 1. Press <kbd>Enter</kbd> to check.</p>

        <div class="actions">
          <button type="button" id="check" class="primary">Check</button>
          <button type="button" id="hint">Hint</button>
          <button type="button" id="reveal">Show answer</button>
          <button type="button" id="next">New equation</button>
        </div>

        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
        <ol id="hints" class="hints"></ol>
      </section>
    </main>

    <script src="chem.js"></script>
    <script src="app.js"></script>
  </body>
</html>
